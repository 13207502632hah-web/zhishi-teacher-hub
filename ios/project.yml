name: ZhishiMobile
options:
  bundleIdPrefix: cn.zhishiyan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  ZhishiMobile:
    type: application
    platform: iOS
    sources:
      - path: ZhishiMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.zhishiyan.mobile
        PRODUCT_NAME: 知师研室
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: ZhishiMobile/Info.plist
      properties:
        CFBundleDisplayName: 知师研室
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
