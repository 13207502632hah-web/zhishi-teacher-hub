<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f35"><title>知师研室 · 离线记录</title><style>body{margin:0;background:#f4f2ea;color:#17352e;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 28px)}.mark{width:46px;height:46px;border-radius:14px;background:#d8f16b;display:grid;place-items:center;font-weight:900}.card{background:#fffefa;border:1px solid #dfe5df;border-radius:18px;padding:20px;margin-top:20px}h1{font-size:26px;margin:18px 0 4px}p{color:#71817a;margin:0}label{display:grid;gap:6px;margin-top:16px;font-size:13px}input,select,textarea,button{font:inherit;border-radius:11px}input,select,textarea{border:1px solid #ced8d1;background:#fff;padding:13px;color:#17352e}textarea{min-height:180px;resize:vertical}button{border:0;background:#173f35;color:#fff;padding:14px;margin-top:18px;width:100%;font-weight:700}.notice{background:#eef3e9;padding:12px;border-radius:10px;margin-top:14px;font-size:13px}.link{display:block;text-align:center;color:#315d4d;margin-top:16px}</style></head><body><main class="wrap"><div class="mark">知</div><h1>网络暂时不可用</h1><p>先把课堂现场记下来。重新联网并打开工作台后，这份草稿会自动同步。</p><section class="card"><label>记录类型<select id="kind"><option value="lesson_note">课堂记录</option><option value="homework">作业想法</option><option value="feedback_draft">反馈草稿</option><option value="reflection">教学反思</option><option value="idea">临时想法</option></select></label><label>标题<input id="title" maxlength="160" placeholder="例如：九年级法治课课堂观察"></label><label>内容<textarea id="content" maxlength="20000" placeholder="记录学生表现、课堂进度、作业或下次调整…"></textarea></label><button id="save">保存到本机待同步</button><div id="notice" class="notice" hidden></div></section><a class="link" href="/v2/record">重新连接工作台</a></main><script>
const KEY='zhishi-mobile-outbox-v1',DRAFT='zhishi-mobile-offline-draft-v1';
const field=(id)=>document.getElementById(id),read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch{return fallback}};
const saved=read(DRAFT,{});field('kind').value=saved.kind||'lesson_note';field('title').value=saved.title||'';field('content').value=saved.content||'';
const persist=()=>localStorage.setItem(DRAFT,JSON.stringify({kind:field('kind').value,title:field('title').value,content:field('content').value}));
['kind','title','content'].forEach((id)=>field(id).addEventListener(id==='kind'?'change':'input',persist));
field('save').onclick=()=>{const title=field('title').value.trim(),content=field('content').value.trim();if(!title||!content)return alert('请填写标题和内容');const raw=read(KEY,[]),items=Array.isArray(raw)?raw:[],id=crypto.randomUUID(),item={id,operationId:'offline-'+id,baseVersion:0,kind:field('kind').value,title,content,occurredAt:new Date().toISOString(),lessonId:null,classId:null,source:'web'};items.push(item);localStorage.setItem(KEY,JSON.stringify(items));localStorage.removeItem(DRAFT);field('title').value='';field('content').value='';const notice=field('notice');notice.hidden=false;notice.textContent='已保存在这台设备，待联网后自动同步。当前待同步 '+items.length+' 条。'};
</script></body></html>
