name: Bug 报告
description: 提交一个可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 附上错误信息、截图或接口返回。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 看到...
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 登录/权限
        - 教学闭环
        - 题库/组卷
        - 结算
        - 小程序（暂停）
        - 其他
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: Node 版本、浏览器、本地/生产等。
