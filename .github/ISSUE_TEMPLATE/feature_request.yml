name: 功能建议
description: 提出一个明确的功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 尽量描述交互、数据与权限边界。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: dropdown
    id: scope
    attributes:
      label: 涉及模块
      options:
        - 工作台/课时
        - 作业/反馈
        - 题库/组卷
        - 学情/数据中心
        - 结算
        - 其他
    validations:
      required: true
